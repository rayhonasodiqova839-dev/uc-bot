# fly.toml app configuration file generated for uc-bot-p-nj4q on 2026-08-22T11:59:13Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'uc-bot-p-nj4q'
primary_region = 'ams'

[build]

[env]
  PORT = '8080'

[[mounts]]
  source = 'rbu_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/visit'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
